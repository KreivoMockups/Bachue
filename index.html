<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malla Soberana Muisca - IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans selection:bg-emerald-500/30 overflow-x-hidden">

    <header class="p-4 md:p-6 border-b border-slate-800/50 flex flex-col md:flex-row justify-between items-center gap-4 z-20 bg-slate-950/80 backdrop-blur-sm">
        
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(16,185,129,0.8)]"></div>
            <h1 class="text-lg md:text-xl font-light tracking-widest text-slate-300 text-center md:text-left">
                <strong class="text-white font-bold">MALLA SOBERANA</strong> <span class="hidden md:inline">|</span><br class="md:hidden"> GOBERNANZA DE DATOS
            </h1>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
            
            <button id="btn-toggle-voice" class="w-full sm:w-auto px-4 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 text-xs tracking-wider uppercase font-bold rounded transition-all flex items-center justify-center gap-2 outline-none">
                <span id="voice-icon" class="text-base">🔊</span>
                <span id="voice-text">Voz Activada</span>
            </button>

            <select id="case-selector" class="w-full sm:w-auto bg-slate-900 border border-slate-700 text-slate-300 text-sm rounded focus:ring-emerald-500 focus:border-emerald-500 block p-2.5 font-light outline-none cursor-pointer">
                <option value="CASE_GOV_001">Escenario 1: Despliegue y Apropiación (Showroom)</option>
                <option value="CASE_GOV_002">Escenario 2: Gobernanza y Privacidad (Ley 1581)</option>
            </select>

            <button id="btn-start" class="w-full sm:w-auto px-6 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm tracking-wider uppercase font-bold rounded transition-all shadow-lg hover:shadow-emerald-500/20 whitespace-nowrap">
                Iniciar Simulación
            </button>
        </div>

    </header>

    <main class="flex-grow relative flex items-center justify-center p-4 md:p-8">
        
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40 overflow-hidden">
            <div id="pentagon-A" class="absolute top-20 left-1/4 w-20 h-20 md:w-32 md:h-32 pentagon-shape border-4 border-orange-500/50 bg-orange-900/20 transition-glow flex items-center justify-center">
                <span class="text-orange-400 text-[8px] md:text-xs font-bold tracking-widest">CHIMINIGAGUA</span>
            </div>
            <div id="pentagon-B" class="absolute top-20 right-1/4 w-20 h-20 md:w-32 md:h-32 pentagon-shape border-4 border-cyan-500/50 bg-cyan-900/20 transition-glow flex items-center justify-center">
                <span class="text-cyan-400 text-[8px] md:text-xs font-bold tracking-widest">BACHUÉ</span>
            </div>
            <div id="pentagon-Xue" class="absolute bottom-20 left-1/4 md:left-1/3 w-16 h-16 md:w-24 md:h-24 pentagon-shape border-2 border-slate-300/30 bg-slate-800/20 transition-glow flex items-center justify-center">
                <span class="text-slate-400 text-[8px] md:text-[10px] font-bold">XUE</span>
            </div>
            <div id="pentagon-Chia" class="absolute bottom-20 right-1/4 md:right-1/3 w-16 h-16 md:w-24 md:h-24 pentagon-shape border-2 border-green-500/30 bg-green-900/20 transition-glow flex items-center justify-center">
                <span class="text-green-400 text-[8px] md:text-[10px] font-bold">CHÍA</span>
            </div>
            <div id="pentagon-Bochica" class="absolute bottom-10 left-1/2 -translate-x-1/2 w-20 h-20 md:w-28 md:h-28 pentagon-shape border-2 border-blue-400/30 bg-blue-900/20 transition-glow flex items-center justify-center">
                <span class="text-blue-300 text-[8px] md:text-[10px] font-bold">BOCHICA</span>
            </div>
            
            <svg class="absolute inset-0 w-full h-full -z-10 opacity-20" xmlns="http://www.w3.org/2000/svg">
                <line x1="25%" y1="20%" x2="75%" y2="20%" stroke="currentColor" stroke-width="1" class="text-slate-500"/>
                <line x1="25%" y1="20%" x2="50%" y2="80%" stroke="currentColor" stroke-width="1" class="text-slate-500"/>
                <line x1="75%" y1="20%" x2="50%" y2="80%" stroke="currentColor" stroke-width="1" class="text-slate-500"/>
            </svg>
        </div>

        <div class="relative z-10 w-full max-w-4xl min-h-[600px] flex flex-col items-center justify-start mt-6 md:mt-0">
            
            <div id="analysis-box" class="w-full bg-slate-900/80 border border-slate-700/50 p-6 md:p-8 rounded-xl shadow-2xl transition-all duration-700 min-h-[250px] mb-8 relative overflow-hidden flex flex-col justify-center">
                <div id="fluid-perimeter" class="absolute inset-0 opacity-0 scale-100 transition-all duration-700 pointer-events-none rounded-xl"></div>
                
                <h2 class="text-xs md:text-sm text-slate-400 uppercase tracking-widest mb-4 font-bold border-b border-slate-700 pb-2 relative z-10 shrink-0">Contexto de Estado a Evaluar</h2>
                
                <p id="narrative-text" class="text-lg md:text-xl leading-relaxed text-slate-300 font-light relative z-10 transition-all duration-700 ease-in-out">
                    </p>

                <div id="active-thought-container" class="mt-6 hidden relative z-10 border-t border-slate-700/50 pt-4 md:pt-6 transition-all duration-500">
                    <span id="active-agent-name" class="text-[10px] md:text-xs font-bold tracking-widest mb-2 block"></span>
                    <p id="active-thought-text" class="text-xl md:text-2xl font-medium leading-relaxed"></p>
                </div>
            </div>

            <div id="consensus-crystal" class="glass-crystal w-full md:w-3/4 p-6 md:p-8 rounded-3xl opacity-0 translate-y-10 transition-all duration-1000 ease-out hidden relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white to-transparent opacity-50"></div>
                
                <div class="flex flex-col md:flex-row items-center justify-center gap-2 md:gap-3 mb-6">
                    <span class="text-emerald-400 text-2xl hidden md:block">✓</span>
                    <h3 class="text-lg md:text-2xl font-bold text-white tracking-wider text-center">CONSENSO ÉTICO SOBERANO</h3>
                </div>
                <div id="plan-container" class="space-y-4 text-slate-200 text-base md:text-lg font-light max-h-60 overflow-y-auto custom-scrollbar pr-2 md:pr-4">
                    </div>
            </div>

        </div>
    </main>

    <script src="registry.js"></script>
    <script src="app.js"></script>
</body>
</html>
