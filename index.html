<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malla Soberana Muisca - IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* La forma matemática del pentágono */
        .pentagon-shape {
            clip-path: polygon(50% 0%, 100% 38%, 81% 100%, 19% 100%, 0% 38%);
        }
        
        /* Efectos de cristal para el consenso */
        .glass-crystal {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255,255,255,0.05);
        }

        /* Animaciones fluidas */
        .transition-glow { transition: all 0.8s ease-in-out; }
        
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.3); }
        }
        .speaking { animation: pulse-glow 1.5s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans overflow-hidden selection:bg-emerald-500/30">

    <header class="p-6 border-b border-slate-800/50 flex justify-between items-center z-20 bg-slate-950/80 backdrop-blur-sm">
        <div class="flex items-center gap-4">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(16,185,129,0.8)]"></div>
            <h1 class="text-xl font-light tracking-widest text-slate-300">
                <strong class="text-white font-bold">MALLA SOBERANA</strong> | GOBERNANZA DE DATOS
            </h1>
        </div>
        <button id="btn-start" class="px-8 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm tracking-wider uppercase font-bold rounded transition-all shadow-lg hover:shadow-emerald-500/20">
            Iniciar Simulación
        </button>
    </header>

    <main class="flex-grow relative flex items-center justify-center p-8">
        
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
            <div id="pentagon-A" class="absolute top-20 left-1/4 w-32 h-32 pentagon-shape border-4 border-orange-500/50 bg-orange-900/20 transition-glow flex items-center justify-center">
                <span class="text-orange-400 text-xs font-bold tracking-widest">CHIMINIGAGUA</span>
            </div>
            <div id="pentagon-B" class="absolute top-20 right-1/4 w-32 h-32 pentagon-shape border-4 border-cyan-500/50 bg-cyan-900/20 transition-glow flex items-center justify-center">
                <span class="text-cyan-400 text-xs font-bold tracking-widest">BACHUÉ</span>
            </div>
            <div id="pentagon-Xue" class="absolute bottom-20 left-1/3 w-24 h-24 pentagon-shape border-2 border-slate-300/30 bg-slate-800/20 transition-glow flex items-center justify-center">
                <span class="text-slate-400 text-[10px] font-bold">XUE</span>
            </div>
            <div id="pentagon-Chia" class="absolute bottom-20 right-1/3 w-24 h-24 pentagon-shape border-2 border-green-500/30 bg-green-900/20 transition-glow flex items-center justify-center">
                <span class="text-green-400 text-[10px] font-bold">CHÍA</span>
            </div>
            <div id="pentagon-Bochica" class="absolute bottom-10 left-1/2 -translate-x-1/2 w-28 h-28 pentagon-shape border-2 border-blue-400/30 bg-blue-900/20 transition-glow flex items-center justify-center">
                <span class="text-blue-300 text-[10px] font-bold">BOCHICA</span>
            </div>
            
            <svg class="absolute inset-0 w-full h-full -z-10 opacity-20" xmlns="http://www.w3.org/2000/svg">
                <line x1="25%" y1="20%" x2="75%" y2="20%" stroke="currentColor" stroke-width="1" class="text-slate-500"/>
                <line x1="25%" y1="20%" x2="50%" y2="80%" stroke="currentColor" stroke-width="1" class="text-slate-500"/>
                <line x1="75%" y1="20%" x2="50%" y2="80%" stroke="currentColor" stroke-width="1" class="text-slate-500"/>
            </svg>
        </div>

        <div class="relative z-10 w-full max-w-4xl h-[600px] flex flex-col items-center">
            
            <div id="analysis-box" class="w-full bg-slate-900/80 border border-slate-700/50 p-8 rounded-xl shadow-2xl transition-all duration-700 min-h-[200px] mb-8 relative overflow-hidden">
                <div id="fluid-perimeter" class="absolute inset-0 opacity-0 transition-all duration-700 pointer-events-none"></div>
                
                <h2 class="text-sm text-slate-400 uppercase tracking-widest mb-4 font-bold border-b border-slate-700 pb-2">Contexto de Estado a Evaluar</h2>
                <p id="narrative-text" class="text-xl leading-relaxed text-slate-300 font-light relative z-10">
                    Presione "Iniciar Simulación" para comenzar el análisis de la Malla Soberana Muisca.
                </p>
            </div>

            <div id="consensus-crystal" class="glass-crystal w-3/4 p-8 rounded-3xl opacity-0 translate-y-10 transition-all duration-1000 ease-out hidden relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white to-transparent opacity-50"></div>
                
                <div class="flex items-center justify-center gap-3 mb-6">
                    <span class="text-emerald-400 text-2xl">✓</span>
                    <h3 class="text-2xl font-bold text-white tracking-wider text-center">CONSENSO ÉTICO SOBERANO</h3>
                </div>
                <div id="plan-container" class="space-y-4 text-slate-200 text-lg font-light">
                    </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
